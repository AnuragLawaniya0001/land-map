services:
  livemap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livemap-app
    restart: unless-stopped
    ports:
      - "4800:4800"  # Frontend (Nginx + React UI)
      - "4801:4801"  # Backend API (FastAPI)
    env_file:
      - ./backend/.env
    environment:
      - PORT=4801
      - HOST=0.0.0.0
      - FRONTEND_URL=http://localhost:4800
      - LOCAL_STORAGE_PATH=/app/backend/storage
      - GIS_MODEL_DIR=/app/backend/models
    volumes:
      # Persistent colony files and user uploads
      - ./backend/storage:/app/backend/storage
      # AI Model weights mounted directly from host for instant loading
      - ./backend/models:/app/backend/models
