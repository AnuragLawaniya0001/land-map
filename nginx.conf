server {
    listen 4800;
    server_name _;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Frontend Static Assets
    location / {
        root /app/frontend/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache static asset bundles
    location /assets/ {
        root /app/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API requests to backend FastAPI on port 4801
    location /api/ {
        proxy_pass http://127.0.0.1:4801;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large GIS file uploads and AI model pipeline execution
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Direct Health Check endpoint
    location /health {
        proxy_pass http://127.0.0.1:4801/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
